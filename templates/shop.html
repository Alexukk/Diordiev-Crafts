{% extends "base.html" %}

{% block title %}Shop - Diordiev Crafts{% endblock %}

{% block content %}
    <section class="shop-page container">
        <div class="shop-controls">
            <h1 class="page-title">All Products</h1>

            <div class="dropdown">
                <button class="sort-button">
                    <span>Sort & Filter</span>
                    <span class="arrow">⩒</span>
                </button>
                <div class="dropdown-content">
                    <div class="filter-group">
                        <p class="filter-title">Price</p>
                        <label>
                            <input type="checkbox" name="sort_by" value="price_asc">
                            Low to High
                        </label>
                        <label>
                            <input type="checkbox" name="sort_by" value="price_desc">
                            High to Low
                        </label>
                    </div>

                    <div class="filter-group" data-category="boxes">
                        <p class="filter-title">Woodenware</p>
                        <label>
                            <input type="checkbox" name="type" value="boxes">
                            Boxes
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="stands">
                            Stands
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="figurines">
                            Figurines
                        </label>
                    </div>

                    <div class="filter-group" data-category="jewelry">
                        <p class="filter-title">Jewelry</p>
                        <label>
                            <input type="checkbox" name="type" value="bracelets">
                            Bracelets
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="earrings">
                            Earrings
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="necklaces">
                            Necklaces
                        </label>
                    </div>

                    <div class="filter-group" data-category="candles">
                        <p class="filter-title">Candles</p>
                        <label>
                            <input type="checkbox" name="type" value="soy">
                            Soy
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="beeswax">
                            Beeswax
                        </label>
                        <label>
                            <input type="checkbox" name="type" value="scented">
                            Scented
                        </label>
                    </div>

                    <button class="apply-filters-button">Apply</button>
                </div>
            </div>
        </div>
        <hr>
        <div class="row g-4">
    {% for product in products %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
            <img src="{{ './static/' + product.photo1}}" class="card-img-top" alt="{{ product.title }}">
              <div class="card-body">
                <h5 class="card-title">{{ product.title }}</h5>
                  <hr>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <p class="card-text mb-0">{{ product.price }}$</p>
                    <a href="{{ url_for('shop', product_id=product.id) }}" class="btn btn-success">More</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
    </section>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sortButton = document.querySelector('.sort-button');
        const dropdownContent = document.querySelector('.dropdown-content');

        sortButton.addEventListener('click', (event) => {
            event.stopPropagation();
            dropdownContent.classList.toggle('show');
        });

        document.addEventListener('click', (event) => {
            if (!dropdownContent.contains(event.target) && !sortButton.contains(event.target)) {
                dropdownContent.classList.remove('show');
            }
        });

        document.querySelector('.apply-filters-button').addEventListener('click', () => {
            const checkboxes = dropdownContent.querySelectorAll('input[type="checkbox"]:checked');
            const params = [];

            checkboxes.forEach(checkbox => {
                if (checkbox.name === 'type') {
                    params.push(`type=${checkbox.value}`);
                }
                if (checkbox.name === 'sort_by') {
                    params.push(`sort_by=${checkbox.value}`);
                }
            });

            window.location.href = `/shop?${params.join('&')}`;
        });
    });
</script>
{% endblock %}
