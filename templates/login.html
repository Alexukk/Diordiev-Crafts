{% extends "base.html" %}

{% block title %}Admin Login - Diordiiev Crafts{% endblock %}

{% block content %}
<style>
    /* ================================================= */
    /* GENERAL LAYOUT AND STYLES */
    /* ================================================= */
    .login-page {
        max-width: 450px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* Input focus style consistency */
    .form-control:focus {
        border-color: #7A5C58;
        box-shadow: 0 0 0 0.25rem rgba(122, 92, 88, 0.25);
    }

    /* Flash Messages */
    .flash-messages {
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 5px;
        background-color: #f8d7da; /* Light red/danger background */
        color: #721c24; /* Dark red text */
        border: 1px solid #f5c6cb;
    }

    .flash-messages p {
        margin: 0;
        font-weight: 500;
    }

    /* ================================================= */
    /* BRAND LOGIN BUTTON */
    /* ================================================= */
    .login-button {
        width: 100%;
        min-height: 45px;
        /* Brand color */
        background-color: #7A5C58;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        margin-top: 20px;
    }

    .login-button:hover {
        background-color: #634a47; /* Darker on hover */
        color: white;
        box-shadow: 0 4px 8px rgba(122, 92, 88, 0.3);
    }
</style>

<section class="login-page container">
    <h2 class="text-center mb-4"><i class="fa-solid fa-user-shield me-2"></i>Administrator Login</h2>
    <hr class="mb-4">

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label for="username" class="form-label fw-bold">Username:</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-bold">Password:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-button">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Log In
        </button>
    </form>
</section>
{% endblock %}
