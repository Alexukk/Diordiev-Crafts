{% extends "base.html" %}

{% block title %}Create New Product - Admin{% endblock %}

{% block content %}
<style>
    /* ================================================= */
    /* FIRM BUTTON STYLES (Create Product) */
    /* ================================================= */
    .btn-diordiev-color {
        /* Brand color */
        background-color: #7A5C58;
        border-color: #7A5C58;
        color: white;
        font-weight: 600;
        min-width: 180px;
        transition: background-color 0.2s, border-color 0.2s;
    }
    .btn-diordiev-color:hover {
        background-color: #634a47;
        border-color: #634a47;
        color: white;
    }

    /* Input focus style consistency */
    .form-control:focus, .form-select:focus {
        border-color: #7A5C58;
        box-shadow: 0 0 0 0.25rem rgba(122, 92, 88, 0.25);
    }
</style>
<section class="container mt-5 py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card p-4 shadow-sm">
                <h2 class="card-title text-center mb-4"><i class="fa-solid fa-box-open me-2"></i>Create New Product</h2>
                <hr>
                <form action="{{ url_for('create_product') }}" method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="title" class="form-label">Product Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>

                    <div class="mb-3">
                        <label for="text" class="form-label">Product Description</label>
                        <textarea class="form-control" id="text" name="text" rows="5" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Price (€)</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" required placeholder="e.g. 49.99">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <optgroup label="Woodenware">
                                <option value="Boxes">Boxes</option>
                                <option value="Vases">Vases</option>
                                <option value="Figurines">Figurines</option>
                                <option value="Other">Other</option>
                            </optgroup>
                            <optgroup label="Jewelry">
                                <option value="Bracelets">Bracelets</option>
                                <option value="Earrings">Earrings</option>
                                <option value="Necklaces">Necklaces</option>
                                <option value="Sets">Sets</option>
                            </optgroup>
                            <optgroup label="Candles">
                                <option value="Soy">Soy</option>
                                <option value="Beeswax">Beeswax</option>
                                <option value="Scented">Scented</option>
                            </optgroup>
                        </select>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label for="status" class="form-label">Product Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="common">Available (Common)</option>
                            <option value="sale">Promotion (Sale)</option>
                            <option value="sold">Sold Out (Unavailable)</option>
                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="photo1" class="form-label">Photo 1</label>
                        <input type="file" class="form-control" id="photo1" name="photo1" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="photo2" class="form-label">Photo 2</label>
                        <input type="file" class="form-control" id="photo2" name="photo2" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label for="photo3" class="form-label">Photo 3</label>
                        <input type="file" class="form-control" id="photo3" name="photo3" accept="image/*" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-diordiev-color mt-3">
                            <i class="fa-solid fa-plus me-1"></i>Create Product
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
